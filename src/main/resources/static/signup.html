<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #e0f4e0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo-square {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background-image: url('image.jpg'); /* your logo image */
      background-size: cover;
      border-radius: 10px;
      border: 2px solid #6aa86b;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #4b8b4b;
    }

    .form-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .roles {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    .roles button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      font-size: 16px;
      background-color: #b8e6b8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .roles button:hover {
      background-color: #a1d6a1;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #6aa86b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #5b965c;
    }

    p {
      text-align: center;
      margin-top: 15px;
    }

    a {
      color: #4b8b4b;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="logo-square"></div>

  <div class="container">
    <form class="form-box" onsubmit="submitForm(event)">
      <h2>🌿 Create Account</h2>
      <input type="text" name="username" placeholder="👤 Username" required />
      <input type="password" name="password" placeholder="🔒 Password" required />
      
      <div class="roles">
        <input type="hidden" id="roleInput" name="role" required />
        <button type="button" onclick="setRole('Helper')">🐾 Helper</button>
        <button type="button" onclick="setRole('Vet')">🐶 Vet</button>
        <button type="button" onclick="setRole('Shelter')">🏠 Shelter</button>
      </div>

      <button type="submit" class="submit-btn">🌱 Sign Up</button>
      <p>Already have an account? <a href="index.html">Login here</a></p>
    </form>
  </div>
  <script src="signup.js"></script>
</body>


  <script>
    function setRole(role) {
      document.getElementById('roleInput').value = role;
      alert('Role selected: ' + role);
    }

    function submitForm(e) {
      e.preventDefault(); // prevent normal form action

      const username = document.querySelector('input[name="username"]').value;
      const password = document.querySelector('input[name="password"]').value;
      const role = document.querySelector('input[name="role"]').value;

      if (!role) {
        alert("Please select a role!");
        return;
      }

      fetch("/signup", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ username, password, role }),
      })
      .then((response) => {
        if (response.ok) {
          alert("✅ Signed up successfully!");
          window.location.href = "index.html"; // redirect to login
        } else {
          alert("❌ Signup failed. Username may already exist.");
        }
      })
      .catch((err) => {
        alert("⚠️ Error connecting to server: " + err);
      });
    }
  </script>
</body>
</html>
