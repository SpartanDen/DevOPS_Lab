<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Animal | Happy Tails</title>
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div class="logo-square">🐾</div>

  <div class="report-container">
    <h2>📢 Report an Animal</h2>

    <form id="reportForm">
      <div class="radio-group">
        <label><input type="radio" name="animalType" value="Cat" required /> 🐱 Cat</label>
        <label><input type="radio" name="animalType" value="Dog" required /> 🐶 Dog</label>
      </div>

      <input type="text" id="location" placeholder="📍 Location" required />
      <input type="text" id="state" placeholder="💬 State (e.g., Injured, Hungry)" required />
      <textarea id="description" placeholder="📝 Description (Optional)"></textarea>

      <button type="button" id="reportBtn">🚀 Report Now</button>
      <button type="button" onclick="window.location.href='home.html'" style="background:#ddd; color:#333; margin-top:10px;">
        ⬅️ Back to Home
      </button>
      
    </form>
  </div>

  <script src="report.js"></script>
</body>
</html>
